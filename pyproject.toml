[project]
name = "ai-cv-builder"
version = "0.1.0"
description = "Desktop app that tailors CVs to job openings using an LLM-backed semantic career graph."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "google-genai>=0.3.0",
    "PySide6>=6.7",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    # Version 4, Phase 4.5: RTF resume ingestion (app/resume_reader.py) and
    # the multipart file-upload route (api/routes/jobs.py) that reads
    # PDF/DOCX/RTF/TXT/MD uploads for it — FastAPI's UploadFile requires
    # python-multipart to be installed, even though nothing here imports
    # it directly.
    "striprtf>=0.0.33",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.hatch.build.targets.wheel]
packages = ["app", "api", "contracts", "db", "domain", "prompts", "providers", "scripts", "ui"]
