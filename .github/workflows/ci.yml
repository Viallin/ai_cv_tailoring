name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # tests/test_ui/*.py instantiate a QApplication at import time
      # (PySide6) — ubuntu-latest has no display server, so Qt aborts
      # during test collection without this.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --legacy-peer-deps: typescript ~6.0.2 (pinned) vs. openapi-typescript's
      # peer range (^5.x) genuinely conflict; --legacy-peer-deps is the same
      # workaround `npm install` already needs locally.
      - run: npm ci --legacy-peer-deps
      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npm run test
