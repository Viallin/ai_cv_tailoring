name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # tests/test_ui/*.py instantiate a QApplication at import time
      # (PySide6) — ubuntu-latest has no display server, so Qt aborts
      # during test collection without this.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      # PySide6's "offscreen" platform plugin still dynamically links
      # libEGL; ubuntu-latest doesn't ship it by default.
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom@30 requires Node ^22.22.2 || ^24.15.0 || >=26.0.0.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npm run test
